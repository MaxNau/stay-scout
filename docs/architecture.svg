<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1030" viewBox="0 0 1240 1030" role="img" aria-labelledby="title desc">
  <title id="title">StayScout: Architecture</title>
  <desc id="desc">An external caller sends HTTP and JSON requests to the Gateway, which calls the Search Service over gRPC. The Search Service stores search state and results in Postgres. Starting a search publishes a SearchRequested message to RabbitMQ, which delivers it to a consumer inside the Search Service. The consumer saves six batches at five-second intervals and, after the last batch, publishes SearchCompleted to RabbitMQ. RabbitMQ delivers it to the Notification Service, which logs the search ID. A Housekeeping job creates the RabbitMQ exchanges and queues before the services start. Everything runs in docker-compose.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowStart" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .heading { font-size: 28px; font-weight: 700; }
      .node-title { font-size: 19px; font-weight: 650; }
      .sub { font-size: 14px; fill: #334155; }
      .edge-label { font-size: 14px; font-weight: 600; fill: #475569; }
      .node { stroke-width: 1.6; }
      .boundary { fill: none; stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 8 6; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .both { fill: none; stroke: #64748b; stroke-width: 2; marker-start: url(#arrowStart); marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1240" height="1030" rx="24" fill="#ffffff"/>
  <text x="620" y="52" text-anchor="middle" class="heading">StayScout: Architecture</text>

  <!-- External caller -->
  <rect x="190" y="82" width="440" height="92" rx="18" fill="#f1f5f9" stroke="#94a3b8" class="node"/>
  <text x="410" y="112" text-anchor="middle" class="node-title">External caller</text>
  <text x="410" y="138" text-anchor="middle" class="sub">Postman  ·  curl  ·  Swagger</text>
  <text x="410" y="160" text-anchor="middle" class="sub">POST /searches  ·  GET /searches/{id}</text>

  <!-- docker-compose boundary -->
  <rect x="40" y="210" width="1160" height="780" rx="24" class="boundary"/>
  <text x="1180" y="236" text-anchor="end" class="edge-label">docker-compose</text>

  <path d="M410 174 V230" class="both"/>
  <text x="432" y="200" class="edge-label">HTTP / JSON</text>

  <!-- Gateway -->
  <rect x="110" y="232" width="600" height="112" rx="18" fill="#dbeafe" stroke="#60a5fa" class="node"/>
  <text x="410" y="270" text-anchor="middle" class="node-title">Gateway</text>
  <text x="410" y="295" text-anchor="middle" class="sub">ASP.NET Core Web API</text>
  <text x="410" y="318" text-anchor="middle" class="sub">Controller  ·  Mediator  ·  Typed gRPC client</text>

  <!-- Search Service -->
  <rect x="70" y="390" width="710" height="420" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="100" y="424" class="node-title">Search Service</text>
  <text x="100" y="446" class="sub">ASP.NET Core gRPC  ·  EF Core  ·  MassTransit</text>

  <rect x="220" y="470" width="380" height="72" rx="16" fill="#dcfce7" stroke="#22c55e" class="node"/>
  <text x="410" y="500" text-anchor="middle" class="node-title">gRPC Endpoint</text>
  <text x="410" y="524" text-anchor="middle" class="sub">StartSearch  ·  GetSearch</text>

  <path d="M410 344 V468" class="both"/>
  <text x="432" y="370" class="edge-label">gRPC request / response</text>

  <path d="M280 542 V598" class="both"/>
  <text x="268" y="574" text-anchor="end" class="edge-label">create / read</text>

  <rect x="95" y="600" width="270" height="130" rx="16" fill="#e0f2fe" stroke="#38bdf8" class="node"/>
  <text x="230" y="634" text-anchor="middle" class="node-title">Postgres</text>
  <text x="230" y="660" text-anchor="middle" class="sub">Search status and results</text>
  <text x="230" y="683" text-anchor="middle" class="sub">EF Core  ·  atomic batch save</text>

  <rect x="465" y="600" width="290" height="130" rx="16" fill="#dcfce7" stroke="#22c55e" class="node"/>
  <text x="610" y="634" text-anchor="middle" class="node-title">Search Consumer</text>
  <text x="610" y="660" text-anchor="middle" class="sub">Processes six batches</text>
  <text x="610" y="683" text-anchor="middle" class="sub">5-second intervals</text>

  <path d="M365 665 H465" class="both"/>
  <text x="415" y="650" text-anchor="middle" class="edge-label">read / write</text>

  <text x="425" y="770" text-anchor="middle" class="sub">After the sixth batch the search is marked Completed. A restart resumes from the last saved batch.</text>

  <!-- RabbitMQ -->
  <rect x="950" y="432" width="220" height="358" rx="18" fill="#fef3c7" stroke="#fbbf24" class="node"/>
  <text x="1060" y="466" text-anchor="middle" class="node-title">RabbitMQ</text>
  <rect x="968" y="484" width="184" height="176" rx="12" fill="#fde68a" stroke="#f59e0b" class="node"/>
  <text x="1060" y="564" text-anchor="middle" class="node-title" style="font-size:16px">SearchRequested</text>
  <text x="1060" y="588" text-anchor="middle" class="sub">internal to Search Service</text>
  <rect x="968" y="676" width="184" height="86" rx="12" fill="#fde68a" stroke="#f59e0b" class="node"/>
  <text x="1060" y="712" text-anchor="middle" class="node-title" style="font-size:16px">SearchCompleted</text>
  <text x="1060" y="736" text-anchor="middle" class="sub">consumed by Notification</text>

  <!-- Messaging arrows -->
  <path d="M600 506 H948" class="arrow"/>
  <text x="864" y="496" text-anchor="middle" class="edge-label">SearchRequested</text>

  <path d="M948 630 H757" class="arrow"/>
  <text x="864" y="620" text-anchor="middle" class="edge-label">deliver</text>

  <path d="M757 700 H948" class="arrow"/>
  <text x="864" y="690" text-anchor="middle" class="edge-label">SearchCompleted</text>

  <!-- Notification -->
  <path d="M1060 790 V858" class="arrow"/>
  <text x="1080" y="830" class="edge-label">Event delivery</text>

  <rect x="940" y="860" width="240" height="104" rx="18" fill="#f3e8ff" stroke="#c084fc" class="node"/>
  <text x="1060" y="896" text-anchor="middle" class="node-title">Notification Service</text>
  <text x="1060" y="922" text-anchor="middle" class="sub">Consumes SearchCompleted</text>
  <text x="1060" y="944" text-anchor="middle" class="sub">Logs search ID</text>

  <!-- Housekeeping -->
  <rect x="110" y="860" width="490" height="100" rx="18" fill="#f1f5f9" stroke="#94a3b8" class="node"/>
  <text x="355" y="894" text-anchor="middle" class="node-title">Housekeeping</text>
  <text x="355" y="919" text-anchor="middle" class="sub">One-shot job</text>
  <text x="355" y="941" text-anchor="middle" class="sub">Creates exchanges and queues before the services start</text>

  <path d="M600 910 H890 V775 H948" class="dashed"/>
  <text x="745" y="900" text-anchor="middle" class="edge-label">provisions queues</text>
</svg>
