<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120">
	<defs>
		<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
			<path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
		</marker>
		<style>
			text { font-family: Inter, Arial, sans-serif; fill: #0f172a; }
			.title { font-size: 27px; font-weight: 700; }
			.heading { font-size: 18px; font-weight: 650; }
			.detail { font-size: 14px; fill: #334155; }
			.label { font-size: 12px; font-weight: 600; fill: #475569; }
			.node { stroke-width: 1.5; }
			.oneway { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
			.internal { fill: none; stroke: #16a34a; stroke-width: 2; marker-end: url(#arrow); }
		</style>
	</defs>

	<rect width="1000" height="1120" rx="24" fill="#fff"/>
	<text x="500" y="48" text-anchor="middle" class="title">StayScout: Architecture</text>

	<!-- External caller -->
	<rect x="300" y="75" width="400" height="78" rx="16" fill="#f1f5f9" stroke="#94a3b8" class="node"/>
	<text x="500" y="106" text-anchor="middle" class="heading">External Caller</text>
	<text x="500" y="131" text-anchor="middle" class="detail">Postman · curl · Swagger</text>

	<!-- Docker Compose boundary -->
	<rect x="35" y="180" width="930" height="910" rx="22" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 5"/>
	<rect x="60" y="166" width="150" height="28" rx="7" fill="#fff"/>
	<text x="70" y="185" class="detail" font-weight="650">Docker Compose</text>

	<!-- Gateway -->
	<rect x="180" y="220" width="640" height="105" rx="17" fill="#dbeafe" stroke="#60a5fa" class="node"/>
	<text x="500" y="253" text-anchor="middle" class="heading">Gateway</text>
	<text x="500" y="278" text-anchor="middle" class="detail">ASP.NET Core Web API</text>
	<text x="500" y="301" text-anchor="middle" class="detail">REST Controller · Typed gRPC client</text>

	<!-- HTTP request and response -->
	<path d="M470 153 V218" class="oneway"/>
	<path d="M510 218 V153" class="oneway"/>
	<rect x="270" y="165" width="175" height="25" rx="5" fill="#fff"/>
	<text x="357" y="182" text-anchor="middle" class="label">Request (JSON)</text>
	<rect x="535" y="190" width="175" height="25" rx="5" fill="#fff"/>
	<text x="622" y="207" text-anchor="middle" class="label">Response (JSON)</text>

	<!-- Search Service -->
	<rect x="75" y="365" width="850" height="480" rx="21" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
	<text x="500" y="398" text-anchor="middle" class="heading">Search Service · ASP.NET Core gRPC</text>

	<!-- gRPC request and response -->
	<path d="M480 325 V433" class="oneway"/>
	<path d="M520 433 V325" class="oneway"/>
	<rect x="290" y="345" width="155" height="24" rx="5" fill="#f0fdf4"/>
	<text x="367" y="362" text-anchor="middle" class="label">gRPC request</text>
	<rect x="535" y="405" width="155" height="24" rx="5" fill="#f0fdf4"/>
	<text x="612" y="422" text-anchor="middle" class="label">gRPC response</text>

	<!-- gRPC endpoint -->
	<rect x="275" y="435" width="450" height="78" rx="14" fill="#dbeafe" stroke="#60a5fa" class="node"/>
	<text x="500" y="465" text-anchor="middle" class="heading">gRPC Endpoint</text>
	<text x="500" y="489" text-anchor="middle" class="detail">StartSearch · GetSearchResults</text>

	<!-- Search state -->
	<rect x="105" y="610" width="340" height="125" rx="15" fill="#dcfce7" stroke="#22c55e" class="node"/>
	<text x="275" y="644" text-anchor="middle" class="heading">Search State</text>
	<text x="275" y="669" text-anchor="middle" class="detail">In-memory results and status</text>
	<text x="275" y="693" text-anchor="middle" class="detail">Pending · Running · Completed</text>

	<!-- Background worker -->
	<rect x="555" y="610" width="340" height="125" rx="15" fill="#dcfce7" stroke="#22c55e" class="node"/>
	<text x="725" y="644" text-anchor="middle" class="heading">Background Worker</text>
	<text x="725" y="669" text-anchor="middle" class="detail">Adds six batches</text>
	<text x="725" y="693" text-anchor="middle" class="detail">5-second intervals</text>

	<!-- Endpoint creates state / reads results -->
	<path d="M400 513 V558 H275 V608" class="internal"/>
	<rect x="100" y="530" width="220" height="24" rx="5" fill="#f0fdf4"/>
	<text x="210" y="547" text-anchor="middle" class="label">Create state / read results</text>

	<!-- Endpoint starts worker -->
	<path d="M600 513 V558 H725 V608" class="internal"/>
	<rect x="620" y="530" width="130" height="24" rx="5" fill="#f0fdf4"/>
	<text x="685" y="547" text-anchor="middle" class="label">Start worker</text>

	<!-- Worker reads state -->
	<rect x="452" y="626" width="96" height="20" rx="5" fill="#f0fdf4"/>
	<text x="500" y="640" text-anchor="middle" class="label">Read</text>
	<path d="M555 650 H445" class="oneway"/>

	<!-- Worker updates state -->
	<path d="M445 690 H555" class="oneway"/>
	<rect x="452" y="696" width="96" height="20" rx="5" fill="#f0fdf4"/>
	<text x="500" y="710" text-anchor="middle" class="label">Update</text>

	<text x="500" y="781" text-anchor="middle" class="detail">After batch 6, mark the search Completed</text>

	<!-- Publish completion event -->
	<path d="M725 735 V868 H500 V890" class="oneway"/>
	<rect x="736" y="786" width="150" height="26" rx="6" fill="#fff"/>
	<text x="811" y="804" text-anchor="middle" class="label">Publish event</text>

	<!-- RabbitMQ -->
	<rect x="260" y="892" width="480" height="75" rx="15" fill="#fef3c7" stroke="#fbbf24" class="node"/>
	<text x="500" y="921" text-anchor="middle" class="heading">RabbitMQ</text>
	<text x="500" y="946" text-anchor="middle" class="detail">SearchCompleted event</text>

	<!-- Event delivery -->
	<path d="M500 967 V994" class="oneway"/>
	<text x="520" y="986" class="label">Event delivery</text>

	<!-- Notification service -->
	<rect x="260" y="996" width="480" height="70" rx="15" fill="#f3e8ff" stroke="#c084fc" class="node"/>
	<text x="500" y="1024" text-anchor="middle" class="heading">Notification Service</text>
	<text x="500" y="1048" text-anchor="middle" class="detail">Consumes event · Logs search ID</text>
</svg>
